[project]
name = "exception-local-variable-collector"
version = "0.1.0"
description = "Turns an exception's traceback frames into a bounded dict of local variables."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
